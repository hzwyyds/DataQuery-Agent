[project]
name = "dataquery-agent"
version = "0.1.0"
description = "Local-first natural-language data query and analysis agent"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiosqlite>=0.21,<1",
    "duckdb>=1.4,<2",
    "fastapi>=0.116,<1",
    "langgraph>=1.0,<2",
    "openpyxl>=3.1,<4",
    "openai>=2.0,<3",
    "pandas>=2.3,<3",
    "pyarrow>=21,<24",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.16,<2",
    "sqlglot>=27,<30",
    "uvicorn[standard]>=0.35,<1",
    "xlrd>=2.0,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "xlwt>=1.3,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
